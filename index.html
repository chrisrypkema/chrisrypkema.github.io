<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bubble Link Cloud</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #020202; /* dark background */
        height: 100%;
        font-family: sans-serif;
    }

    /* Clickable overlay for each bubble */
    .bubble-link {
        position: absolute;
        border-radius: 50%;
        cursor: pointer;
        transform: translate(-50%, -50%);
        z-index: 10;
    }
</style>
</head>
<body>

<canvas id="bubbleCanvas"></canvas>

<script>
// ------------------------------
// Configuration
// ------------------------------
const LINK_COUNT = 13;
const LINKS = [
    "https://example1.com","https://example2.com","https://example3.com",
    "https://example4.com","https://example5.com","https://example6.com",
    "https://example7.com","https://example8.com","https://example9.com",
    "https://example10.com","https://example11.com","https://example12.com",
    "https://example13.com"
];

const canvas = document.getElementById("bubbleCanvas");
const ctx = canvas.getContext("2d");
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;

// ------------------------------
// Bubble Class
// ------------------------------
class Bubble {
    constructor(linkIndex) {
        this.linkIndex = linkIndex;
        this.reset();
    }

    reset() {
        this.x = Math.random() * W;
        this.y = Math.random() * H;
        this.r = 40 + Math.random() * 40;
        this.opacity = 0.7 + Math.random() * 0.2;
        this.growth = 0.05 + Math.random() * 0.05;
        this.popSize = 120 + Math.random() * 60;

        this.dx = (Math.random() - 0.5) * 1;
        this.dy = (Math.random() - 0.5) * 1;

        placeBubbleLink(this.linkIndex, this.x, this.y, this.r * 2);
    }

    update() {
        this.x += this.dx;
        this.y += this.dy;
        this.r += this.growth;

        // bounce off edges
        if (this.x < this.r || this.x > W - this.r) this.dx *= -1;
        if (this.y < this.r || this.y > H - this.r) this.dy *= -1;

        placeBubbleLink(this.linkIndex, this.x, this.y, this.r * 2);

        // pop and regenerate
        if (this.r >= this.popSize) {
            this.popAnimation();
            this.reset();
        }
    }

    draw() {
        let grd = ctx.createRadialGradient(
            this.x - this.r/3, this.y - this.r/3, this.r*0.1,
            this.x, this.y, this.r
        );
        grd.addColorStop(0, `rgba(255,255,255,${this.opacity})`);
        grd.addColorStop(0.3, `rgba(180,220,255,${this.opacity * 0.4})`);
        grd.addColorStop(1, `rgba(100,150,255,0)`);

        ctx.beginPath();
        ctx.fillStyle = grd;
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();
    }

    popAnimation() {
        let r = this.r;
        for (let i = 0; i < 20; i++) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, r + i*2, 0, Math.PI*2);
            ctx.strokeStyle = `rgba(255,255,255,${1 - i/20})`;
            ctx.stroke();
        }
    }
}

// ------------------------------
// Create HTML link overlays
// ------------------------------
function createBubbleLinks() {
    for (let i = 0; i < LINK_COUNT; i++) {
        let a = document.createElement("a");
        a.href = LINKS[i];
        a.target = "_blank";
        a.classList.add("bubble-link");
        a.id = "bubble-link-" + i;
        document.body.appendChild(a);
    }
}

function placeBubbleLink(index, x, y, size) {
    const link = document.getElementById("bubble-link-" + index);
    link.style.left = x + "px";
    link.style.top = y + "px";
    link.style.width = size + "px";
    link.style.height = size + "px";
}

// ------------------------------
// Setup
// ------------------------------
createBubbleLinks();

let bubbles = [];
for (let i = 0; i < LINK_COUNT; i++) {
    bubbles.push(new Bubble(i));
}

// ------------------------------
// Animation Loop
// ------------------------------
function animate() {
    ctx.clearRect(0, 0, W, H);

    bubbles.forEach(b => {
        b.update();
        b.draw();
    });

    requestAnimationFrame(animate);
}

animate();

// ------------------------------
// Resize Handling
// ------------------------------
window.addEventListener("resize", () => {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
});
</script>

</body>
</html>
